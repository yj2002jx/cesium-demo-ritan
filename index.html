<!DOCTYPE html>
<html lang="zh‑CN">
<head>
    <meta charset="UTF‑8">
    <meta name="viewport" content="width=device‑width, initial‑scale=1.0">
    <title>Cesium北京日坛三维可视化Demo</title>
    <!--CDN引入Cesium，不用本地下载庞大库文件-->
    <script src="https://cdn.jsdelivr.net/npm/cesium@1.119/Build/Cesium/Cesium.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/cesium@1.119/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <style>
        html,body{margin:0;padding:0;height:100%;overflow:hidden;}
        #cesiumContainer{width:100%;height:100%;}
        .tool‑bar{position:absolute;top:10px;left:10px;z‑index:999;}
        button{padding:6px 12px;margin:2px;background:#fff;border:1px solid #999;border‑radius:4px;cursor:pointer;}
    </style>
</head>
<body>
    <div class="tool‑bar">
        <button id="btn‑vec">矢量底图</button>
        <button id="btn‑img">卫星影像</button>
    </div>
    <div id="cesiumContainer"></div>

    <script>
        // --------------------------【替换为你自己申请的token】--------------------------
        Cesium.Ion.defaultAccessToken = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJub25jZSI6ImtMNnNXcXpqamU5b2dvN2wiLCJqdGkiOiIxZWFlNGRiMC1lNjRiLTQxNTktOTY4ZS1hZDgzYzIxZWEzY2IiLCJpZCI6NTIwMDY5LCJpc3MiOiJodHRwczovL2FwaS5jZXNpdW0uY29tIiwiYXVkIjoidW5kZWZpbmVkX2RlZmF1bHQiLCJpYXQiOjE3OTE2ODg2MDZ9.5uEtL35DKgB3ce63mFrqVmPioLJZWUpTOQlgBn_Wt1U";
        const viewer = new Cesium.Viewer('cesiumContainer',{
            animation:false,
            timeline:false

        //镜头飞到北京日坛公园 经纬度：116.434,39.922，高度1200米
        viewer.camera.flyTo({
            destination : Cesium.Cartesian3.fromDegrees(116.434, 39.922, 1200),
            duration:2
        });

        //后续Day3‑4新增的功能代码写在这里

</body>
</html>
